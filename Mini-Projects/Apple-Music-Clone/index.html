<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex">
        <div class="sidebar flex m-1">
            <div class="logo flex">
                <img class="filter" style=" margin-bottom: 26px; margin-left: 10px;" src="svg/logo.svg"
                    xmlns="http://www.w3.org/2000/svg" alt="">
                <img src="svg/close.svg" alt="" class="close filter">
            </div>
            <div class="home fw ">
                <ul>
                    <li class="items-center"><img class="filter" src="svg/search.svg" alt="search">Search</li>
                    <li class="selected rounded items-center"><img class="filter" src="svg/home.svg" alt="home">Home
                    </li>
                    <li class="items-center"><img class="filter" src="svg/new.svg" alt="New">New</li>
                    <li class="items-center"><img class="filter" src="svg/radio.svg" alt="Radio">Radio</li>
                </ul>
            </div>
            <div class="library m-1">
                <h5 class="grey">Library</h5>
                <div class="songlist">
                    <ul>

                    </ul>
                </div>
            </div>
            <div class="fixed">
                <ul>
                    <li class="items-center"><img class="filter" src="svg/appicon.svg" style="width: 24px;" alt="">Open
                        in Music <img class="filter" style="width: 12px" src="svg/arrow.svg" alt=""></li>
                    <li class="items-center">Sign in</li>
                </ul>
            </div>
        </div>
        <div class="right p1 m-1">
            <div class="header flex">
                <img src="svg/hamburger.svg" alt="" class="hamburger filter">
                <h1>Home</h1>
            </div>
            <div class="collections">
                <h3>Top Picks for You</h3>
                <div class="cardContainer">
                    <div data-folder="all-songs" class="card">
                        <div class="play">
                            <img src="svg/play.svg" alt="">
                        </div>
                        <p>Made for You</p>
                        <h4>Your Station</h4>
                    </div>
                    <div data-folder="i-wish-u-were-here" class="card">
                        <div class="play">
                            <img src="svg/play.svg" alt="">
                        </div>
                        <p></p>
                        <h4>New Realeased</h4>
                    </div>
                </div>
            </div>
            <div class="collections">
                <h3>Your Albums</h3>
                <div class="cardContainer">
                    

                </div>
            </div>

        </div>
    </div>
    <div class="player">
        <div class="leftside">
            <img src="svg/shuffle.svg" alt="">
            <img id="previous" src="svg/previous.svg" alt="">
            <img id="play" src="svg/play.svg" alt="">
            <img id="next" src="svg/next.svg" alt="">
            <img src="svg/loop.svg" alt="">
        </div>
        <div class="song-title">
            <div class="song-info">
                <div class="title song-name"></div>
                <div class="songtime">
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="seekbar">
                <div class="circle"></div>
            </div>
        </div>
        <div class="rightside">
            <img src="svg/lyrics.svg" alt="" id="lyrics">
            <img src="svg/queue.svg" alt="" id="queue">
            <div class="volume">
                <img src="svg/vol-icon.svg" alt="">
                <input class="volume-bar" type="range">
            </div>
        </div>
    </div>
    <div class="history">
        <div class="logo flex">
            <h3>History</h3>
            <img src="svg/close.svg" alt="" class="close filter">   
        </div>
        <div class="library m-1">
                <div class="songlist">
                    <ul>

                    </ul>
                </div>
            </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
